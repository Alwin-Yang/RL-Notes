site_name: RL Notes
site_description: Reinforcement learning notes, from foundations to practice.
repo_name: Alwin-Yang/RL-Notes
repo_url: https://github.com/Alwin-Yang/RL-Notes
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Zewen Yang
extra:
  generator: false
theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: pink
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Foundations:
      - Overview: foundations/index.md
      - Bias and Variance: foundations/bias-and-variance.md
      - Q&A: foundations/q-and-a.md
  - Policy Optimization:
      - Overview: policy-optimization/index.md
      - Policy Improvement: policy-optimization/policy-improvement.md
      - Off-policy Learning: policy-optimization/off-policy.md
      - Actor-Critic Foundations: policy-optimization/actor-critic.md
      - A2C / A3C: policy-optimization/a2c-a3c.md
      - TRPO: policy-optimization/trpo.md
      - PPO: policy-optimization/ppo.md
      - Actor-Critic Q&A: policy-optimization/actor-critic-q-and-a.md
      - Q&A: policy-optimization/q-and-a.md
  - Actor-Critic:
      - Soft Actor-Critic: actor-critic/sac.md
  - Q-Learning:
      - Overview: q-learning/index.md
      - Deep Q-Networks: q-learning/dqn.md
      - Double DQN: q-learning/double-dqn.md
      - N-Step Returns: q-learning/n-step-returns.md
      - Q&A: q-learning/q-and-a.md
  - Offline RL:
      - Overview: offline-rl/index.md
      - Advantage Estimation: offline-rl/advantage-estimation.md
      - Q&A: offline-rl/q-and-a.md
  - Advanced Topics:
      - Overview: advanced/index.md
      - Q&A: advanced/q-and-a.md
  - Practice:
      - Overview: practice/index.md
      - Q&A: practice/q-and-a.md
  - References:
      - Reading list: references/index.md
      - Q&A: references/q-and-a.md
